services:
  - type: web
    name: rota-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PUBLIC_API_URL
        value: https://rota-api-nmg8.onrender.com
      - key: BILLING_CURRENCY
        value: USD
      - key: RUN_WORKER
        value: "true"
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_HASH
        sync: false
