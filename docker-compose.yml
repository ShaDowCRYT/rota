services:
  redis:
    image: redis:7-alpine
    container_name: rota-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - rota-redis-data:/data
    restart: unless-stopped

volumes:
  rota-redis-data:
